<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Music Medley">
  <meta name="description" content="Deezerプレビュー音源で好きな曲をメドレー再生するWebプレイヤー">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Music Medley</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>🎵 Music Medley</h1>
        <p>Deezerプレビューでお気に入りを連続再生</p>
      </div>
      <button id="installBtn" class="small hidden">ホーム画面に追加</button>
    </header>

    <section class="search">
      <form id="searchForm">
        <input id="searchInput" autocomplete="off" placeholder="曲名・アーティスト名で検索">
        <button>検索</button>
      </form>
      <div id="searchStatus" class="status"></div>
      <div id="results"></div>
    </section>

    <section class="playlist-section">
      <div class="section-title">
        <h2>プレイリスト</h2>
        <div>
          <button id="shuffleBtn" class="small">🔀 シャッフル</button>
          <button id="clearBtn" class="small danger">全削除</button>
        </div>
      </div>
      <div id="playlist" class="playlist empty">曲を追加してください</div>
    </section>

    <section class="player">
      <img id="cover" alt="" src="">
      <div class="now">
        <div id="nowTitle">再生停止中</div>
        <div id="nowArtist"></div>
        <div id="nowAlbum"></div>
      </div>
      <input id="seek" type="range" min="0" max="30" step="0.1" value="0">
      <div class="times"><span id="currentTime">0:00</span><span id="duration">0:30</span></div>
      <div class="controls">
        <button id="prevBtn" aria-label="前の曲">⏮</button>
        <button id="playBtn" class="play" aria-label="再生">▶</button>
        <button id="nextBtn" aria-label="次の曲">⏭</button>
      </div>
      <div class="player-options">
        <label>音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label>
        <label><input id="crossfade" type="checkbox"> 曲間フェード</label>
      </div>
      <div id="playerStatus" class="status"></div>
    </section>

    <section class="settings">
      <details>
        <summary>Deezer API設定</summary>
        <p>
          このサイトは検索結果から取得した <code>preview</code> URL をHTML5 Audioで再生します。ブラウザからDeezer APIへ直接アクセスできない場合は、付属のCloudflare Workerを使います。
          API仕様変更時は <code>app.js</code> の <code>DeezerAPI</code> 部分だけ修正してください。
        </p>
        <label>API URL
          <input id="apiBase" value="https://api.deezer.com" placeholder="https://your-worker.workers.dev">
        </label>
      </details>
    </section>
  </main>

  <audio id="audio" preload="auto" playsinline></audio>
  <script src="app.js"></script>
</body>
</html>
