<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Music Medley"><link rel="apple-touch-icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Music Medley</title></head><body><header class="topbar"><b>Music Medley</b><div><button id="themeButton" class="plain">☀️</button><button id="installButton" class="plain" hidden>＋</button></div></header><main class="app">
<section class="panel"><div class="head"><div><small>SEARCH</small><h1>曲を探す</h1></div><button id="historyButton" class="secondary">検索履歴</button></div><form id="searchForm" class="search"><input id="query" type="search" placeholder="曲名・アーティスト名" required><button id="searchButton">検索</button></form><div id="history" class="chips" hidden></div><div id="searchStatus" class="status"></div><div id="results" class="results"></div><button id="moreResults" class="more" hidden>さらに読み込む</button></section>
<section class="panel player"><div class="coverbox"><img id="playerCover" src="icon.svg"><button id="expandCover">⛶</button></div><div class="info"><small>NOW PLAYING</small><h2 id="playerTitle">曲を選択してください</h2><p id="playerArtist">—</p><span id="playerAlbum">—</span></div><div class="progress"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step=".1"><span id="duration">0:30</span></div><div class="controls"><button id="prev">⏮</button><button id="play" class="mainplay">▶</button><button id="next">⏭</button><button id="fav">♡</button></div><div class="options"><label>再生 <select id="previewLength"><option>10</option><option>20</option><option selected>30</option></select>秒</label><label>クロスフェード <select id="crossfade"><option value="0">なし</option><option>1</option><option>2</option><option>3</option><option>5</option><option>8</option><option>10</option></select>秒</label><label><input id="shuffle" type="checkbox"> シャッフル</label><label><input id="repeat" type="checkbox"> リピート</label></div><audio id="audioA" preload="auto"></audio><audio id="audioB" preload="auto"></audio></section>
<section class="panel"><div class="head"><div><small>QUEUE</small><h2>次に再生</h2></div><button id="clearQueue" class="secondary">クリア</button></div><div id="queue" class="list"></div><p id="queueEmpty" class="empty">ここに「次に再生」する曲が入ります。</p></section>
<section class="panel"><div class="head"><div><small>PLAYLIST</small><h2 id="playlistTitle">プレイリスト</h2></div><div><button id="share" class="secondary">URL共有</button><button id="manage" class="secondary">管理</button></div></div><div id="playlist" class="list"></div><p id="playlistEmpty" class="empty">検索結果から曲を追加してください。</p></section></main><div id="toast"></div>
<div id="playlistModal" class="modal" hidden><div class="card"><div class="modalhead"><h2>プレイリスト管理</h2><button data-close="playlistModal">×</button></div><form id="newPlaylist"><input id="newName" placeholder="プレイリスト名" required><button>作成</button></form><div id="playlistChoices"></div></div></div>
<div id="trackModal" class="modal" hidden><div class="card"><div class="modalhead"><h2>曲の設定</h2><button data-close="trackModal">×</button></div><b id="trackName"></b><label>再生開始位置（秒）<input id="trackStart" type="number" min="0" max="30" step=".1"></label><label>再生終了位置（秒）<input id="trackEnd" type="number" min=".1" max="30" step=".1"></label><p>プレビュー音源は通常30秒以内です。</p><button id="saveTrack">保存</button></div></div>
<div id="imageModal" class="imageModal" hidden><button data-close="imageModal">×</button><img id="largeCover"></div><footer>Music Medley · Deezerプレビュー再生</footer><script src="app.js"></script></body></html>
