<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Deezerのプレビュー音源で好きな曲をメドレー再生するプレイヤー">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Music Medley</title>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">PERSONAL MUSIC MEDLEY</p>
        <h1>Music Medley</h1>
        <p class="sub">曲名を検索して、好きな曲だけプレイリストに追加できます。</p>
      </div>
    </header>

    <section class="panel search-panel">
      <h2>曲を追加</h2>
      <form id="searchForm" class="search-form">
        <input id="query" type="search" autocomplete="off"
               placeholder="曲名・アーティスト名を入力" required>
        <button type="submit" id="searchButton">検索</button>
      </form>
      <p class="hint">例：Deja Vu / Running in the 90's / Dave Rodgers</p>
      <div id="status" class="status" aria-live="polite"></div>
      <div id="results" class="results"></div>
    </section>

    <section class="panel player-panel">
      <div class="now-playing">
        <img id="cover" class="cover" src="" alt="" hidden>
        <div class="now-text">
          <div class="label">NOW PLAYING</div>
          <h2 id="nowTitle">まだ再生していません</h2>
          <p id="nowArtist">曲をプレイリストに追加してください</p>
        </div>
      </div>

      <audio id="audio" preload="metadata"></audio>

      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="prevButton" class="icon-button" title="前の曲">⏮</button>
        <button id="playButton" class="play-button" title="再生">▶</button>
        <button id="nextButton" class="icon-button" title="次の曲">⏭</button>
      </div>

      <div class="options">
        <label><input id="shuffle" type="checkbox"> シャッフル</label>
        <label><input id="repeat" type="checkbox"> 1曲リピート</label>
        <label class="volume-wrap">音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label>
      </div>
    </section>

    <section class="panel playlist-panel">
      <div class="section-head">
        <div>
          <h2>プレイリスト</h2>
          <p id="count">0曲</p>
        </div>
        <button id="clearButton" class="danger-button">全削除</button>
      </div>
      <div id="playlist" class="playlist"></div>
      <p id="empty" class="empty">検索結果から「追加」を押すと、ここに曲が入ります。</p>
    </section>

    <footer>
      <p>※ 音源の再生には各サービスの利用条件が適用されます。</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
